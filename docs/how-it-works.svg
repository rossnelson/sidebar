<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B61E8"/>
      <stop offset="1" stop-color="#C46BD9"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E56CF"/>
    </marker>
  </defs>

  <rect width="1000" height="860" rx="16" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1F2328">Sidebar is a sidecar, not a wrapper</text>
  <text x="40" y="74" font-size="14" fill="#59636E">Two separate apps side by side. Chrome stays the real, Google-signed Chrome and keeps updating itself.</text>

  <!-- ============ Section 1: what you see ============ -->
  <text x="40" y="116" font-size="12" font-weight="700" fill="#59636E" letter-spacing="1.2">WHAT YOU SEE</text>

  <!-- desktop -->
  <rect x="40" y="128" width="560" height="236" rx="10" fill="#EEF0F3"/>
  <!-- Sidebar's window: the drawer, partly under Chrome -->
  <rect x="56" y="160" width="172" height="172" rx="12" fill="url(#space)"/>
  <!-- sidebar contents -->
  <rect x="66" y="170" width="128" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.35"/>
  <g fill="#FFFFFF" fill-opacity="0.3">
    <rect x="66" y="194" width="28" height="22" rx="6"/>
    <rect x="99" y="194" width="28" height="22" rx="6"/>
    <rect x="132" y="194" width="28" height="22" rx="6"/>
    <rect x="165" y="194" width="28" height="22" rx="6"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.22">
    <rect x="66" y="226" width="110" height="8" rx="4"/>
    <rect x="66" y="242" width="96" height="8" rx="4"/>
  </g>
  <rect x="66" y="260" width="128" height="1" fill="#FFFFFF" fill-opacity="0.4"/>
  <rect x="66" y="270" width="128" height="16" rx="5" fill="#FFFFFF" fill-opacity="0.55"/>
  <g fill="#FFFFFF" fill-opacity="0.22">
    <rect x="66" y="292" width="128" height="16" rx="5"/>
  </g>

  <!-- Chrome's own window, in the hole -->
  <rect x="204" y="150" width="372" height="192" rx="11" fill="#FFFFFF" stroke="#C9CDD2" filter="drop-shadow(-3px 2px 5px rgba(0,0,0,0.25))"/>
  <path d="M204,161 a11,11 0 0 1 11,-11 h350 a11,11 0 0 1 11,11 v15 h-372 z" fill="#DEE1E6"/>
  <circle cx="218" cy="163" r="4" fill="#FF5F57"/>
  <circle cx="231" cy="163" r="4" fill="#FEBC2E"/>
  <circle cx="244" cy="163" r="4" fill="#28C840"/>
  <rect x="258" y="155" width="96" height="21" rx="6" fill="#FFFFFF"/>
  <rect x="360" y="159" width="80" height="13" rx="5" fill="#EDEFF2"/>
  <rect x="204" y="176" width="372" height="26" fill="#FFFFFF"/>
  <rect x="214" y="182" width="352" height="15" rx="7.5" fill="#F1F3F4"/>
  <rect x="204" y="202" width="372" height="1" fill="#E3E5E8"/>
  <text x="390" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#1A73E8">Google Chrome</text>
  <text x="390" y="282" text-anchor="middle" font-size="12" fill="#59636E">unchanged · your tabs, extensions and sync</text>

  <!-- callouts -->
  <circle cx="130" cy="324" r="5" fill="#6E56CF" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M130,324 V376 H636" fill="none" stroke="#6E56CF" stroke-width="1.5"/>
  <circle cx="568" cy="232" r="5" fill="#1A73E8" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M568,232 H636" fill="none" stroke="#1A73E8" stroke-width="1.5"/>

  <g font-size="13" fill="#1F2328">
    <rect x="636" y="196" width="324" height="78" rx="10" fill="#E8F0FE"/>
    <text x="652" y="220" font-weight="700" fill="#1A73E8">Chrome's own window</text>
    <text x="652" y="240">Sidebar only moves and resizes it to</text>
    <text x="652" y="258">make room. Chrome draws everything inside.</text>

    <rect x="636" y="320" width="324" height="78" rx="10" fill="#F0EDFC"/>
    <text x="652" y="344" font-weight="700" fill="#6E56CF">Sidebar's window</text>
    <text x="652" y="364">A separate app draws the sidebar next to</text>
    <text x="652" y="382">Chrome, tucked under it, not inside it.</text>
  </g>

  <!-- ============ Section 2: how they talk ============ -->
  <text x="40" y="440" font-size="12" font-weight="700" fill="#59636E" letter-spacing="1.2">HOW THEY TALK</text>

  <!-- Sidebar process -->
  <rect x="40" y="454" width="210" height="248" rx="12" fill="#F0EDFC" stroke="#6E56CF" stroke-width="1.5"/>
  <text x="58" y="484" font-size="17" font-weight="700" fill="#6E56CF">Sidebar.app</text>
  <g font-size="12.5" fill="#1F2328">
    <text x="58" y="506" fill="#59636E">You build it from this repo.</text>
    <text x="58" y="524" fill="#59636E">Its own process.</text>
    <text x="58" y="556">• Draws the sidebar</text>
    <text x="58" y="578">• Keeps favorites in its own</text>
    <text x="68" y="594">folder</text>
    <text x="58" y="616">• Quit it: Chrome keeps</text>
    <text x="68" y="632">working as normal</text>
    <text x="58" y="654">• Remove it: nothing of</text>
    <text x="68" y="670">Chrome to undo</text>
  </g>

  <!-- Chrome process -->
  <rect x="750" y="454" width="210" height="248" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="768" y="484" font-size="17" font-weight="700" fill="#1A73E8">Google Chrome</text>
  <g font-size="12.5" fill="#1F2328">
    <text x="768" y="506" fill="#59636E">Signed by Google.</text>
    <text x="768" y="524" fill="#59636E">Its own process.</text>
    <text x="768" y="556">• Binary not modified</text>
    <text x="768" y="578">• Updates itself through</text>
    <text x="778" y="594">Google, as before</text>
    <text x="768" y="616">• Sandbox and site</text>
    <text x="778" y="632">isolation as before</text>
    <text x="768" y="654">• No extension, no</text>
    <text x="778" y="670">launch flags</text>
  </g>

  <!-- macOS channels -->
  <rect x="270" y="454" width="460" height="248" rx="12" fill="#F6F8FA" stroke="#D1D9E0" stroke-dasharray="5 4"/>
  <text x="500" y="478" text-anchor="middle" font-size="12" font-weight="700" fill="#59636E" letter-spacing="0.6">macOS PUBLIC APIs · EACH NEEDS A PERMISSION YOU GRANT</text>

  <g font-size="12" fill="#59636E">
    <!-- 1 Accessibility -->
    <rect x="286" y="492" width="428" height="44" rx="8" fill="#FFFFFF" stroke="#D1D9E0"/>
    <text x="300" y="511" font-size="13" font-weight="700" fill="#1F2328">Accessibility</text>
    <text x="300" y="528">Read the window's position, size and title. Move and resize it.</text>
    <!-- 2 Apple Events -->
    <rect x="286" y="544" width="428" height="44" rx="8" fill="#FFFFFF" stroke="#D1D9E0"/>
    <text x="300" y="563" font-size="13" font-weight="700" fill="#1F2328">Apple Events (Chrome's AppleScript)</text>
    <text x="300" y="580">List, switch, open and close tabs. Back, forward, reload. Read the URL.</text>
    <!-- 3 Keystrokes -->
    <rect x="286" y="596" width="428" height="44" rx="8" fill="#FFFFFF" stroke="#D1D9E0"/>
    <text x="300" y="615" font-size="13" font-weight="700" fill="#1F2328">Keystrokes</text>
    <text x="300" y="632">Passes on a Chrome shortcut that you press in the ⌘T palette.</text>
    <!-- 4 Files -->
    <rect x="286" y="648" width="428" height="44" rx="8" fill="#FFFFFF" stroke="#D1D9E0"/>
    <text x="300" y="667" font-size="13" font-weight="700" fill="#1F2328">Read-only files</text>
    <text x="300" y="684">Bookmarks, Preferences, Local State. History is copied, then read.</text>
  </g>

  <!-- arrows: Sidebar -> Chrome for control, Chrome -> Sidebar for files -->
  <g stroke-width="1.6" fill="none">
    <path d="M250,514 H286" stroke="#6E56CF"/>
    <path d="M714,514 H748" stroke="#1A73E8" marker-end="url(#arrowBlue)"/>
    <path d="M250,566 H286" stroke="#6E56CF"/>
    <path d="M714,566 H748" stroke="#1A73E8" marker-end="url(#arrowBlue)"/>
    <path d="M250,618 H286" stroke="#6E56CF"/>
    <path d="M714,618 H748" stroke="#1A73E8" marker-end="url(#arrowBlue)"/>
    <path d="M252,670 H286" stroke="#6E56CF" marker-start="url(#arrowPurple)"/>
    <path d="M714,670 H750" stroke="#1A73E8"/>
  </g>

  <!-- ============ Section 3: never ============ -->
  <text x="40" y="746" font-size="12" font-weight="700" fill="#59636E" letter-spacing="1.2">SIDEBAR NEVER</text>
  <g font-size="13" fill="#1F2328">
    <g fill="#CF222E" font-weight="700">
      <text x="40" y="774">✕</text><text x="40" y="800">✕</text>
      <text x="360" y="774">✕</text><text x="360" y="800">✕</text>
      <text x="680" y="774">✕</text><text x="680" y="800">✕</text>
    </g>
    <text x="60" y="774">installs a Chrome extension</text>
    <text x="60" y="800">injects code or libraries into Chrome</text>
    <text x="380" y="774">patches, re-signs or replaces Chrome</text>
    <text x="380" y="800">adds launch flags or a debugging port</text>
    <text x="700" y="774">runs JavaScript in your pages</text>
    <text x="700" y="800">writes to Chrome's profile files</text>
  </g>
  <text x="40" y="836" font-size="12" fill="#59636E">Network: favicons come from Google's public favicon service, which receives the site's domain. Sidebar sends nothing else.</text>
</svg>
